      <path d="M 74 107 L 88 107 L 87 111 L 73 111 Z" />
      <path d="M 134 88 L 130 107 L 138 107 L 140 90 Z" />
      <path d="M 128 107 L 139 107 L 138 111 L 127 111 Z" />
