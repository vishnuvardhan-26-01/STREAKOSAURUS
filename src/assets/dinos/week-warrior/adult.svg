      <path d="M 72 58 L 80 38 L 88 58 Z" />
      <path d="M 88 50 L 98 28 L 108 50 Z" />
      <path d="M 108 47 L 118 24 L 128 47 Z" />
      <path d="M 128 51 L 138 32 L 146 53 Z" />
      <path d="M 146 58 L 152 44 L 158 60 Z" />
