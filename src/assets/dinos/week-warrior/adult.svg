      <path d="M 80 49 L 88 33 L 96 49 Z" fill="#8F3F1C" />
      <path d="M 100 44 L 108 22 L 116 44 Z" fill="#8F3F1C" />
      <path d="M 120 46 L 128 27 L 136 47 Z" fill="#8F3F1C" />
      <path d="M 138 53 L 144 38 L 150 54 Z" fill="#8F3F1C" />
    </g>

