    <!-- EYE -->
    <ellipse cx="170" cy="82" rx="3" ry="2.6" fill="#1B2217" />
    <circle cx="170.2" cy="82" r="1.6" fill="#C49A45" />
    <circle cx="170.7" cy="81.4" r="0.6" fill="#FFFFFF" />
