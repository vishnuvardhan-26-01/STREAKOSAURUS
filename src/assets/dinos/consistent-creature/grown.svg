      stroke-linejoin="round"
    />

    <!-- Cream Throat & Underbelly -->
    <path
      d="M 74 81
         C 88 88, 112 88, 126 81
         C 134 76, 150 68, 168 64
         C 182 61, 198 56, 204 54
         C 194 56, 180 59, 164 62
         C 146 66, 134 74, 124 77
