      fill="url(#iguaSkin)"
      stroke="#1D1713"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <path d="M 10 67 C 26 76 46 84 64 85 L 64 82 C 46 81 28 72 14 67 Z" fill="#24301D" />

    <!-- HARMONIOUS BALANCED BODY & S-CURVED NECK -->
    <path
      d="M 64 70
         C 64 54, 82 46, 110 46
